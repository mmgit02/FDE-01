---
# One app: approuter (login + UI) and CAP service in the same container, see start.js.
# It replaces the earlier static wireframe app of the same name and keeps its route.
# Service instances are created once, see README ("Deploy to BTP").
applications:
  - name: GR_Automation_Demo
    path: .
    buildpacks:
      - nodejs_buildpack
    command: node start.js
    memory: 512M
    disk_quota: 1G
    instances: 1
    health-check-type: port
    services:
      - gr-automation-xsuaa
      - gr-automation-destination
      - gr-automation-connectivity
    env:
      S4_DESTINATION: DED_HTTP_200
      QTY_TOLERANCE_PCT: "10"
      destinations: '[{"name":"gr-srv","url":"http://127.0.0.1:4004","forwardAuthToken":true}]'
